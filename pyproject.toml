[project]
name = "rhc-causal-bayes"
version = "0.1.0"
description = "Causal effect of right heart catheterization on 30-day mortality: AIPW, Double Machine Learning and hierarchical Bayesian models"
readme = "README.md"
authors = [
    { name = "Zakariae Ayache", email = "zakariae1231919@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "arviz>=1.3.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "numpyro>=0.22.0",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "streamlit>=1.64.0",
]

[project.scripts]
rhc-causal-bayes = "rhc_causal_bayes:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
